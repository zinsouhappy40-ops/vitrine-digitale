databases:
  - name: vitrine-digitale-demo-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: vitrine-digitale-demo
    runtime: python
    repo: https://github.com/zinsouhappy40-ops/vitrine-digitale
    plan: free
    region: frankfurt
    branch: render-demo
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /connexion/
    autoDeployTrigger: off
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: vitrine_digitale
      - key: ALLOWED_HOSTS
        fromService:
          name: vitrine-digitale-demo
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: USE_S3_STORAGE
        value: "True"
      - key: SERVE_MEDIA_FILES
        value: "False"
      - key: S3_ENDPOINT_URL
        value: https://cqvoaewiwirmjotkudjy.storage.supabase.co/storage/v1/s3
      - key: S3_REGION_NAME
        value: eu-west-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: vitrine-media
