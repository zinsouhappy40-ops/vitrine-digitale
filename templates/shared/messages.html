{% if messages %}
  <div class="fixed inset-x-4 top-4 z-50 mx-auto max-w-lg space-y-2" aria-live="polite">
    {% for message in messages %}
      <div class="rounded-xl border border-line bg-white px-4 py-3 text-sm font-medium text-ink-950 shadow-lg">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
