{% if messages %}
  <div class="fixed inset-x-4 top-4 z-50 mx-auto max-w-lg space-y-2" aria-live="polite">
    {% for message in messages %}
      <div class="flex items-center gap-3 border border-line bg-white px-4 py-3 text-sm font-medium text-ink-950 shadow-[0_12px_30px_rgba(26,26,26,0.12)]">
        <span class="size-2 shrink-0 bg-mango-600" aria-hidden="true"></span>{{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
